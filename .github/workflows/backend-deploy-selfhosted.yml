on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
jobs:
  deploy-backend:
    runs-on: [self-hosted]
    concurrency:
      group: default
      cancel-in-progress: false
    steps:
      - run: |
          cd /home/ocelops/Documents/home-server/book-widget/backend
          git fetch origin main
          git reset --hard origin/main
          docker compose up -d --force-recreate --build backend